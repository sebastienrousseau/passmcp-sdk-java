name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, Test, Lint & REUSE (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python for REUSE and manifest scripts
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install REUSE tool
        run: pip install reuse

      - name: Run full offline check gates
        run: make check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Maven build and test lifecycle
        run: mvn -B test
